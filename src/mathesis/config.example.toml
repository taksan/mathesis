# Every Mathesis option, commented. `mathesis config --init` asks a few questions and writes a minimal config.toml in
# the application directory (gitignored); copy lines from here when you need more. Every key is optional.
# API keys are NOT set here: see [providers.gemini].
# Precedence: this file < MATHESIS_* environment variables < command-line flags.
# Restart `mathesis serve` after editing. `mathesis config` shows what is in effect, `mathesis doctor` tests it.
#
# If the provider is unreachable or not configured, lessons and labs are still saved: only the summary / lab guide is
# skipped (one desktop notification per outage). It is checked again on every save, so starting Ollama later works.

# The ONE provider used for everything (summaries and lab guides):
#   ollama | gemini | openai | claude-code | <a name you define under [providers.<name>] below> | none
# Without this line: summaries use ollama and lab guides use claude-code (the original behavior).
# provider = "gemini"

[summary]
# Only to override the provider above for summaries:
# provider = "ollama"
# model = "gemma4:12b"          # a model of the provider in effect (the default one if no provider line here)
# pipeline = "two-stage"        # or "single" (one call; cheaper on an API)
# max_revisions = 2
# enabled = true                # false: lessons are only saved

[lab_guide]
# Only to override the provider above for lab guides:
# provider = "claude-code"
# model = "..."
# enabled = true

[server]
# host = "127.0.0.1"
# port = 5000
# root = "~/notes/_study_roadmap"       # the only folder the server may write into
# notify = true
# notify_on_save = false
# obsidian_open = true                   # a "ready" notification opens the note when clicked
# obsidian_command = "/path/to/Obsidian.AppImage"   # how to reach Obsidian (found automatically if installed)
# editor_command = "gedit"               # used instead when Obsidian is not installed (a graphical editor is found automatically)

# ---- provider details -------------------------------------------------------------------------------------------
# Built in: ollama, claude-code, gemini, openai. A table here changes or extends them. A provider is only USED when it
# is the `provider` above (or a job's override); `mathesis config` / `doctor` warn about one that is configured but unused.

[providers.ollama]
# url = "http://172.17.0.1:11434"
# model = "gemma4:12b"
# num_ctx = 16384                       # Ollama's default (2048) truncates transcripts
# embed_model = "bge-m3:latest"         # matches quiz questions to lessons; always runs on Ollama

[providers.claude-code]                 # the `claude` CLI, headless, no tools; uses your Claude Code login
# command = "claude"
# model = "sonnet"
# timeout = 900

[providers.gemini]                      # Gemini through its OpenAI-compatible endpoint
# API KEY: export GEMINI_API_KEY=... in the shell that starts `mathesis serve` (never put keys in this file;
# the server complains at startup if the variable is missing).
# model = "gemini-3.8-flash"            # default; any model your key can use (2.5 models are deprecated)
# timeout = 600

# Any OpenAI-compatible server: OpenAI (built in; key in OPENAI_API_KEY), OpenRouter, LM Studio, vLLM, llama.cpp...
# pick a name, then use it as `provider = "<name>"` above. If it needs a key, export <NAME>_API_KEY (here:
# OPENROUTER_API_KEY); local servers need none.
# [providers.openrouter]
# type = "openai"
# url = "https://openrouter.ai/api/v1"
# model = "google/gemini-3.8-flash"     # check OpenRouter's model list for the exact id
#
# A second Ollama (another machine / model):
# [providers.big-ollama]
# type = "ollama"
# url = "http://gpu-box:11434"
# model = "qwen3:32b"
