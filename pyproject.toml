[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathesis"
version = "0.1.0"
description = "Saves course transcripts and turns them into study notes with a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2"]

[project.scripts]
mathesis = "mathesis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mathesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
